spring.application.name=nexo-eventos
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=demo
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:nexo_eventos}
spring.data.mongodb.auto-index-creation=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=24h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=NEXO_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.tomcat.max-http-form-post-size=3MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
nexo.base-url=${NEXO_BASE_URL:http://localhost:8080}
nexo.plazo-cancelacion-horas=${NEXO_PLAZO_CANCELACION_HORAS:48}
nexo.reserva-minutos=10
nexo.nif-emisor=${NEXO_NIF_EMISOR:A12345678}
