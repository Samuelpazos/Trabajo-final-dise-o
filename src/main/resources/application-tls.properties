server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${NEXO_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${NEXO_TLS_PASSWORD}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
server.servlet.session.cookie.secure=true
nexo.base-url=${NEXO_BASE_URL:https://localhost:8443}
